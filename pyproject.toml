[project]
name = "llm-observability"
version = "0.1.0"
description = "LLM observability: local span traces, stage breakdown, eval CI gate"
requires-python = ">=3.11"
# Kept in step with requirements.txt. langfuse and qdrant-client were dropped
# with the rewrite: the sink is a local JSONL file and retrieval is in-process.
dependencies = [
    "sentence-transformers>=3.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 88
target-version = "py311"
